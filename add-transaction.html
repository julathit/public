<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Transaction | Tax Calculator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>WeTAX</h2>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="transaction.html" class="active">Transactions</a>
        <a href="account.html">Accounts</a>
        <a href="profile.html">Profile</a>
        <a href="index.html" id="logoutBtn">Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Add Transaction</h1>
      </header>

      <form id="addTransactionForm" class="form-card">

        <label>Option:</label>
        <select id="tOption" required>
          <option value="exchange">exchange</option>
          <option value="tradeTH">tradeTH</option>
          <option value="tradeUS">tradeUS</option>
        </select>

        <label>Date:</label>
        <input type="date" id="tDate" required>

        <label>Symbol:</label>
        <input type="text" id="tDesc" placeholder="Description" required>

        <label>Type:</label>
        <select id="tType" required>
          <option value="buy">buy</option>
          <option value="sell">sell</option>
        </select>

        <label>Amount:</label>
        <input type="number" id="tAmount" placeholder="Amount" required>

        <button type="submit">Save Transaction</button>
      </form>
    </main>
  </div>
  <script src="js/main.js"></script>
  <script src="js/transaction.js"></script>
</body>
</html>
